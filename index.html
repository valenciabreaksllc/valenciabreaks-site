<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <title>Ops Command Hub</title>

    <style>
      html, body, #root {
        min-height: 100%;
        margin: 0;
      }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f3f4f6;
      }

      #password-screen {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .gate-card {
        width: 100%;
        max-width: 390px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      }

      .gate-logo {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: #111827;
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
      }

      .gate-input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        padding: 11px 12px;
        font-size: 14px;
        outline: none;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      .gate-input:focus {
        border-color: #64748b;
        box-shadow: 0 0 0 3px rgba(100, 116, 139, 0.14);
      }

      .gate-button {
        width: 100%;
        margin-top: 14px;
        border: 0;
        border-radius: 10px;
        background: #111827;
        color: white;
        padding: 11px 12px;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      .gate-button:hover {
        background: #020617;
      }

      .gate-error {
        display: none;
        color: #dc2626;
        font-size: 13px;
        margin: 10px 0 0;
      }

    </style>
  </head>

  <body>
    <div id="password-screen">
      <form id="password-form" class="gate-card">
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:22px;">
          <div class="gate-logo">OP</div>
          <div>
            <h1 style="font-size:20px; font-weight:800; color:#111827; margin:0;">Ops Command Hub</h1>
            <p style="font-size:12px; color:#9ca3af; margin:2px 0 0;">Command Center access</p>
          </div>
        </div>

        <label for="password-input" style="display:block; font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; color:#6b7280; margin-bottom:6px;">
          Password
        </label>

        <input id="password-input" class="gate-input" type="password" placeholder="Enter password" autofocus />
        <p id="password-error" class="gate-error">Wrong password. Try again.</p>

        <button class="gate-button" type="submit">Unlock Command Center</button>
      </form>
    </div>

    <div id="root" style="display:none;"></div>

    <script>
      const SHELL_PASSWORD = "opcomics";
      const SHELL_KEY = "jonny_ops_shell_unlocked_v3";

      function showApp() {
        document.getElementById("password-screen").style.display = "none";
        document.getElementById("root").style.display = "block";
      }

      if (localStorage.getItem(SHELL_KEY) === "yes") {
        showApp();
      }

      document.getElementById("password-form").addEventListener("submit", function (e) {
        e.preventDefault();

        const value = document.getElementById("password-input").value;
        const error = document.getElementById("password-error");

        if (value === SHELL_PASSWORD) {
          localStorage.setItem(SHELL_KEY, "yes");
          showApp();
        } else {
          error.style.display = "block";
        }
      });
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
